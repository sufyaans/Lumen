<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen TV – interface prototype</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f5f5f7;--bg2:#ffffff;--bg3:#e6e6ec;--fg:#14141a;--muted:#5d5d6b;--accent:#e5243b;--accent-fg:#fff;
  --scrim:rgba(245,245,247,.0);--shadow:rgba(0,0,0,.28);--line:rgba(0,0,0,.12);
  font-family:"Helvetica Neue",Helvetica,Arial,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0c10;--bg2:#17171e;--bg3:#24242e;--fg:#f4f4f7;--muted:#a0a0ae;--accent:#ff3347;--accent-fg:#fff;
    --scrim:rgba(12,12,16,0);--shadow:rgba(0,0,0,.6);--line:rgba(255,255,255,.14);
  }
}
:root[data-theme="dark"]{
  --bg:#0c0c10;--bg2:#17171e;--bg3:#24242e;--fg:#f4f4f7;--muted:#a0a0ae;--accent:#ff3347;--accent-fg:#fff;
  --scrim:rgba(12,12,16,0);--shadow:rgba(0,0,0,.6);--line:rgba(255,255,255,.14);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:clamp(8px,2vw,28px);padding:12px 4vw;background:linear-gradient(var(--bg) 40%,transparent)}
.logo{font-weight:800;font-size:1.35rem;letter-spacing:-.02em;color:var(--accent);margin-right:6px}
.tabs{display:flex;gap:clamp(2px,1vw,10px);flex:1;min-width:0}
.tab{padding:8px clamp(8px,1.4vw,16px);border-radius:999px;color:var(--muted);font-weight:600;font-size:clamp(.82rem,1.2vw,1.05rem);white-space:nowrap;transition:background .15s,color .15s}
.tab.on{color:var(--fg)}
.tab:focus,.tab:hover{background:var(--bg3);color:var(--fg)}
.tab:focus{box-shadow:0 0 0 3px var(--fg)}
.navr{display:flex;gap:8px;align-items:center}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.15rem;background:var(--bg3)}
.ibtn:focus,.ibtn:hover{box-shadow:0 0 0 3px var(--fg)}
.avatar{background:linear-gradient(135deg,#ff7a45,#c2185b);color:#fff;font-weight:700}

/* hero */
.hero{position:relative;margin:-64px 0 8px;min-height:min(78vh,620px);display:flex;align-items:flex-end;padding:0 4vw 48px;overflow:hidden;background:var(--g)}
.hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 78% 30%,rgba(255,255,255,.28),transparent 38%),
  radial-gradient(circle at 92% 80%,rgba(0,0,0,.35),transparent 45%)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 4%,var(--scrim) 60%),linear-gradient(to right,rgba(0,0,0,.45),transparent 65%)}
.hero>div{position:relative;z-index:1;max-width:560px;color:#fff}
.hero h1{font-size:clamp(2.2rem,6vw,4.4rem);line-height:1;margin:0 0 12px;letter-spacing:-.03em;text-shadow:0 2px 20px rgba(0,0,0,.4)}
.hero p{font-size:clamp(.95rem,1.4vw,1.15rem);line-height:1.45;margin:0 0 20px;color:rgba(255,255,255,.92);max-width:48ch}
.tags{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-weight:600;font-size:.95rem;flex-wrap:wrap}
.pill{padding:2px 8px;border:1px solid currentColor;border-radius:4px;font-size:.8rem}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{padding:12px 26px;border-radius:8px;font-weight:700;font-size:1.05rem;background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(6px);transition:transform .15s}
.btn.pri{background:#fff;color:#111}
.btn:focus,.btn:hover{transform:scale(1.06);box-shadow:0 0 0 3px var(--accent)}

/* rows */
.row{margin:0 0 10px}
.row h3{margin:0;padding:10px 4vw 0;font-size:clamp(1.05rem,1.8vw,1.4rem);font-weight:700;letter-spacing:-.01em}
.strip{display:flex;gap:12px;padding:16px 4vw 22px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.card{position:relative;flex:0 0 auto;border-radius:10px;overflow:hidden;background:var(--g);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;transition:transform .16s,box-shadow .16s;scroll-snap-align:start}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 15%,rgba(255,255,255,.25),transparent 45%),linear-gradient(to top,rgba(0,0,0,.65),transparent 60%)}
.card>*{position:relative}
.card:focus,.card:hover{transform:scale(1.08);z-index:3;box-shadow:0 0 0 3px var(--fg),0 14px 34px var(--shadow)}
.poster{width:clamp(116px,14vw,196px);aspect-ratio:2/3}
.wide{width:clamp(210px,24vw,340px);aspect-ratio:16/9}
.card .t{font-weight:800;font-size:clamp(.95rem,1.3vw,1.2rem);line-height:1.1;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.card .m{font-size:.78rem;opacity:.85;margin-top:3px}
.bar{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.3);margin-top:8px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent)}
.chan{width:clamp(220px,26vw,300px);padding:14px;background:var(--bg2);color:var(--fg);justify-content:flex-start;gap:4px;border:1px solid var(--line)}
.chan::before{display:none}
.chan .top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.logo-b{width:42px;height:42px;border-radius:10px;background:var(--g);display:grid;place-items:center;color:#fff;font-weight:800;font-size:.9rem}
.chan .nm{font-weight:700}
.chan .num{color:var(--muted);font-size:.8rem}
.chan .now{font-weight:600;font-size:.95rem}
.chan .nx{color:var(--muted);font-size:.8rem;margin-top:2px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px}

/* pages */
.page{padding-bottom:60px}
.ph{padding:6px 4vw 0;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.ph h2{margin:0;font-size:clamp(1.6rem,3.4vw,2.4rem);letter-spacing:-.02em}
.chips{display:flex;gap:8px;padding:14px 4vw 4px;overflow-x:auto;scrollbar-width:none}
.chip{flex:0 0 auto;padding:8px 16px;border-radius:999px;background:var(--bg3);font-weight:600;font-size:.95rem}
.chip.on{background:var(--fg);color:var(--bg)}
.chip:focus,.chip:hover{box-shadow:0 0 0 3px var(--accent)}
.grid{display:flex;flex-wrap:wrap;gap:16px;padding:16px 4vw}
.seg{margin-left:auto;display:flex;background:var(--bg3);border-radius:999px;padding:3px}
.seg button{padding:6px 16px;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button.on{background:var(--fg);color:var(--bg)}
.seg button:focus{box-shadow:0 0 0 3px var(--accent)}
.empty{padding:40px 4vw;color:var(--muted)}

/* guide */
.gscroll{overflow:auto;margin:14px 4vw 0;border:1px solid var(--line);border-radius:12px;background:var(--bg2);max-height:68vh}
.grow{display:flex;width:max-content;border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.gch,.gtime{position:sticky;left:0;z-index:2;flex:0 0 132px;padding:12px;background:var(--bg2);border-right:1px solid var(--line);font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:8px}
.gch small{color:var(--muted);font-weight:600}
.gtime{color:var(--muted);font-weight:600;position:sticky;top:0}
.ghead{display:flex;width:max-content;position:sticky;top:0;z-index:3;background:var(--bg2);border-bottom:1px solid var(--line)}
.ghead span{flex:0 0 120px;padding:10px 8px;font-size:.8rem;color:var(--muted);font-weight:600}
.gprog{flex:0 0 auto;margin:5px 2px;padding:10px;border-radius:8px;background:var(--bg3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:.85rem;font-weight:600;transition:background .12s}
.gprog small{display:block;color:var(--muted);font-weight:500;margin-top:2px}
.gprog.now{background:color-mix(in srgb,var(--accent) 22%,var(--bg3))}
.gprog:focus,.gprog:hover,.gch:focus,.gch:hover{box-shadow:inset 0 0 0 3px var(--fg)}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;overflow:auto;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov[hidden]{display:none}
.detail{background:rgba(0,0,0,.6);display:grid;place-items:start center;padding:4vh 3vw}
.dbox{width:min(920px,100%);background:var(--bg2);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px var(--shadow)}
.dtop{position:relative;min-height:300px;background:var(--g);color:#fff;display:flex;align-items:flex-end;padding:24px}
.dtop::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg2),transparent 70%)}
.dtop>div{position:relative;z-index:1}
.dtop h2{font-size:clamp(1.8rem,5vw,3rem);margin:0 0 12px;letter-spacing:-.02em;text-shadow:0 2px 16px rgba(0,0,0,.45)}
.dbody{padding:8px 24px 28px}
.dbody p{line-height:1.55;color:var(--muted);max-width:62ch}
.dbody .btn{background:var(--bg3);color:var(--fg)}
.dbody .btn.pri{background:var(--fg);color:var(--bg)}
.closeb{position:absolute;top:14px;right:14px;z-index:3;background:rgba(0,0,0,.5);color:#fff}
.seasons{display:flex;gap:8px;margin:22px 0 10px}
.ep{display:flex;gap:14px;align-items:center;width:100%;padding:12px;border-radius:10px;transition:background .12s}
.ep:focus,.ep:hover{background:var(--bg3);box-shadow:0 0 0 3px var(--fg)}
.ep .n{font-size:1.3rem;font-weight:800;color:var(--muted);width:30px;text-align:center}
.ep .th{width:116px;aspect-ratio:16/9;border-radius:6px;background:var(--g);flex:0 0 auto}
.ep .tt{font-weight:700}
.ep .ds{color:var(--muted);font-size:.85rem;margin-top:2px}
.sbox{padding:calc(env(safe-area-inset-top,0px) + 16px) 4vw}
.sbox input{width:100%;font:inherit;font-size:1.4rem;padding:16px 20px;border-radius:12px;border:2px solid var(--line);background:var(--bg2);color:var(--fg)}
.sbox input:focus{outline:none;border-color:var(--accent)}

/* player */
.pl{background:#000;color:#fff;overflow:hidden;cursor:none}
.pl.show{cursor:default}
.vid{position:absolute;inset:-20%;background:var(--g);background-size:200% 200%;animation:drift 18s ease-in-out infinite alternate;filter:saturate(1.1)}
.vid::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.22),transparent 40%),radial-gradient(circle at 75% 65%,rgba(0,0,0,.45),transparent 50%)}
@keyframes drift{to{transform:translate(4%,3%) scale(1.08) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.vid{animation:none}html{scroll-behavior:auto}}
.demo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;opacity:.8;font-size:.95rem;pointer-events:none}
.demo b{display:block;font-size:clamp(1.4rem,4vw,2.6rem);margin-bottom:6px}
.ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 20px) 4vw calc(env(safe-area-inset-bottom,0px) + 24px);background:linear-gradient(rgba(0,0,0,.65),transparent 28%,transparent 62%,rgba(0,0,0,.8));transition:opacity .25s}
.pl:not(.show) .ui{opacity:0}
.ptop{display:flex;align-items:center;gap:14px}
.ptop .ibtn{background:rgba(255,255,255,.2);color:#fff}
.ptop h4{margin:0;font-size:1.2rem}
.ptop small{opacity:.8;display:block}
.sp{flex:1}
.badge{background:var(--accent);color:#fff;padding:3px 10px;border-radius:5px;font-weight:800;font-size:.8rem}
.pbot .info{margin-bottom:12px}
.pbot .info b{font-size:clamp(1.2rem,2.6vw,1.8rem)}
.pbot .info span{display:block;opacity:.85;margin-top:2px}
.seek{display:flex;align-items:center;gap:12px;font-size:.9rem;font-variant-numeric:tabular-nums}
.track{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.track b{display:block;height:100%;background:var(--accent)}
.ctrl{display:flex;gap:14px;justify-content:center;margin-top:14px}
.ctrl .ibtn{width:56px;height:56px;font-size:1.3rem;background:rgba(255,255,255,.2);color:#fff}
.entry{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);right:4vw;font-size:clamp(2.4rem,7vw,4.5rem);font-weight:800;text-shadow:0 2px 14px rgba(0,0,0,.6);letter-spacing:.04em}
.cpanel{position:absolute;top:0;bottom:0;left:0;width:min(340px,88vw);background:rgba(10,10,14,.92);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top,0px) + 16px) 10px 16px;overflow:auto;transform:translateX(-100%);transition:transform .22s;z-index:5}
.cpanel.open{transform:none}
.cpanel h5{margin:4px 10px 10px;font-size:1rem}
.cp{display:flex;gap:10px;align-items:center;width:100%;padding:10px;border-radius:10px}
.cp:focus,.cp:hover{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 3px #fff}
.cp.cur{background:rgba(255,255,255,.1)}
.cp small{display:block;opacity:.7;font-size:.78rem}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.25s;z-index:80;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);font-size:.75rem;color:var(--muted);z-index:10;background:var(--bg2);border:1px solid var(--line);padding:4px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}
@media (max-width:640px){.hint{display:none}.hero{min-height:70vh}.ep .th{width:84px}}

/* login */
#login{z-index:60;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 18px calc(env(safe-area-inset-bottom,0px) + 20px);background:radial-gradient(circle at 15% 10%,color-mix(in srgb,var(--accent) 24%,var(--bg)),var(--bg) 55%)}
#login[hidden]{display:none}
.lbox{position:relative;width:min(520px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:28px clamp(18px,4vw,32px);box-shadow:0 30px 80px var(--shadow);margin:auto}
.lbrand{font-weight:800;font-size:1.5rem;letter-spacing:-.02em;color:var(--accent);margin-bottom:10px}
.lbox h1{margin:0 0 6px;font-size:clamp(1.4rem,3.4vw,1.8rem);letter-spacing:-.02em}
.lsub{margin:0 0 18px;color:var(--muted);line-height:1.45}
.lseg{margin:0 0 18px;display:flex}
.lseg button{flex:1;text-align:center;padding:9px 6px}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
.fld small{color:var(--muted);font-weight:500}
.fld input{width:100%;font:inherit;font-size:1.05rem;padding:13px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
.fld input:focus{outline:none;border-color:var(--accent)}
.pwrow{position:relative}
.pwrow input{padding-right:76px}
.pwrow button{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:7px 12px;border-radius:8px;font-weight:600;font-size:.85rem;background:var(--bg3)}
.pwrow button:focus{box-shadow:0 0 0 3px var(--fg)}
.filebox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px;border:2px dashed var(--line);border-radius:12px;margin-bottom:14px}
.filebox.drag{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.filebox .btn{background:var(--bg3);color:var(--fg);padding:10px 18px;font-size:.95rem}
.filebox span{color:var(--muted);font-size:.92rem;flex:1;min-width:140px}
.lerr{min-height:1.3em;margin:0 0 10px;color:var(--accent);font-weight:600;font-size:.92rem}
.lgo{width:100%;text-align:center;background:var(--accent);color:var(--accent-fg);font-size:1.08rem}
.lgo[disabled]{opacity:.7;cursor:wait}
.lnote{margin:14px 0 0;color:var(--muted);font-size:.82rem;line-height:1.45}
.lsaved{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.lsaved h2{margin:0 0 8px;font-size:1rem}
.lsaved .prow{padding:8px 4px}
.lx{position:absolute;top:14px;right:14px}
.lalt{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

/* account */
.pn{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:14px 4vw;max-width:880px}
.pn h3{margin:0 0 12px;font-size:1.1rem}
.who{display:flex;align-items:center;gap:16px;margin:10px 4vw 0}
.big-av{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:1.8rem;font-weight:800;color:#fff;background:var(--g)}
.who h2{margin:0;font-size:clamp(1.5rem,3vw,2rem);letter-spacing:-.02em}
.who p{margin:2px 0 0;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 20px;margin:0 0 16px}
.kv div span{display:block;color:var(--muted);font-size:.82rem}
.kv div b{display:block;margin-top:2px;overflow-wrap:anywhere}
.ok{color:#18a05a}
.btns2{display:flex;gap:10px;flex-wrap:wrap}
.sbtn{padding:10px 18px;border-radius:10px;background:var(--bg3);font-weight:600;font-size:.95rem}
.sbtn.pri{background:var(--fg);color:var(--bg)}
.sbtn.dng{color:var(--accent)}
.sbtn:focus,.sbtn:hover{box-shadow:0 0 0 3px var(--fg)}
.prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .pi{width:42px;height:42px;border-radius:10px;background:var(--g);display:grid;place-items:center;color:#fff;font-weight:800;flex:0 0 auto}
.prow .pt{flex:1;min-width:0}
.prow .pt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pt small{color:var(--muted)}
.tagm{padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);font-weight:700;font-size:.8rem}
.setrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .st{flex:1}
.setrow .st b{display:block}
.setrow .st small{color:var(--muted);line-height:1.4}
.sw{width:52px;height:30px;border-radius:999px;background:var(--bg3);position:relative;flex:0 0 auto;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(22px)}
.sw:focus{box-shadow:0 0 0 3px var(--fg)}
.newp{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:12px}
.newp input{flex:1;min-width:160px;font:inherit;padding:11px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
.newp input:focus{outline:none;border-color:var(--accent)}
.note2{color:var(--muted);font-size:.85rem;line-height:1.45;margin:10px 0 0}
.more{padding:6px 4vw;color:var(--muted);font-size:.9rem}

/* landscape fallback for browsers that cannot lock orientation (e.g. iPhone Safari) */
.pl.rot{inset:auto;top:0;left:0;width:100vh;width:100dvh;height:100vw;height:100dvw;transform-origin:top left;transform:rotate(90deg) translateY(-100%)}
</style>
</head>
<body>

<nav id="nav" aria-label="Main">
  <span class="logo">Lumen</span>
  <div class="tabs" role="tablist">
    <button class="tab" data-f data-tab="home">Home</button>
    <button class="tab" data-f data-tab="live">Live TV</button>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function grad(t){var h=hue(t);return "linear-gradient(145deg,hsl("+h+" 68% 44%),hsl("+((h+55)%360)+" 62% 22%))"}
function seeded(s){return function(){s=(s*9301+49297)%233280;return s/233280}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(sec){sec=Math.max(0,Math.floor(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0")}
function hostOf(u){try{return new URL(u).host}catch(e){return u||""}}
function fmtDate(ts){try{return new Date(ts).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}catch(e){return ""}}

/* ================= persistent state ================= */
var KEY="lumen.v2";
var avGrads=["linear-gradient(135deg,#ff7a45,#c2185b)","linear-gradient(135deg,#4facfe,#4338ca)","linear-gradient(135deg,#34d399,#0f766e)","linear-gradient(135deg,#fbbf24,#b45309)","linear-gradient(135deg,#f472b6,#7e22ce)"];
var settings={landscape:true,theme:"auto"};
var profiles=[{id:"p1",name:"Me",kids:false,color:0,favs:{},list:{},prog:{}},{id:"p2",name:"Guest",kids:false,color:1,favs:{},list:{},prog:{}},{id:"p3",name:"Kids",kids:true,color:2,favs:{},list:{},prog:{}}];
var profId="p1",accounts=[],activeId=null;
function prof(){return profiles.filter(function(p){return p.id===profId})[0]||profiles[0]}
function acct(){return accounts.filter(function(a){return a.id===activeId})[0]||null}
function save(){try{localStorage.setItem(KEY,JSON.stringify({settings:settings,profiles:profiles,profId:profId,accounts:accounts,activeId:activeId}))}catch(e){}}
function load(){
 try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(!s)return;
  if(s.settings)settings=s.settings;
  if(s.profiles&&s.profiles.length)profiles=s.profiles;
  if(s.profId)profId=s.profId;
  if(s.accounts)accounts=s.accounts;
  if(s.activeId)activeId=s.activeId;
 }catch(e){}
}
function savePl(id,entries){
 try{if(entries.length>4000)return false;localStorage.setItem("lumen.pl."+id,JSON.stringify(entries.map(function(e){return [e.name,e.group,e.url,e.type,e.chno||0]})));return true}catch(e){return false}
}
function loadPl(id){
 try{var a=JSON.parse(localStorage.getItem("lumen.pl."+id)||"null");if(!a)return null;return a.map(function(r){return {name:r[0],group:r[1],url:r[2],type:r[3],chno:r[4]}})}catch(e){return null}
}
function dropPl(id){try{localStorage.removeItem("lumen.pl."+id)}catch(e){}}
function applyTheme(){var r=document.documentElement;if(settings.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",settings.theme)}

/* ================= content data ================= */
var DB={},uid=0,SRC={movies:[],shows:[],chans:[]};
var movies=[],shows=[],chans=[],movieG={},showG={},chanCats=["All","Favourites"],heroItem=null;
var KIDCH={Kids:1,Docs:1,Music:1};
function resetDB(){DB={}}
function mkItem(o){o.id="i"+(++uid);o.key=o.type+":"+o.title+(o.type==="chan"?":"+o.num:"");DB[o.id]=o;return o}
var descs=[
 "A former courier is pulled back into the city she swore to leave, for one last job before the lights go out.",
 "Two rivals on opposite sides of a river town discover the bridge between them is the only thing keeping both afloat.",
 "When the signal drops across the coast, a small crew has to decide who they trust and who they don\u2019t.",
 "A quiet year in a loud family: weddings, a missing recipe and a road trip nobody wanted.",
 "An engineer inherits a failing observatory and a stack of letters that point somewhere unexpected."
];
var base=new Date();base.setMinutes(base.getMinutes()<30?0:30,0,0);
function clock(mins){var d=new Date(base.getTime()+mins*60000);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function demoData(){
 resetDB();
 var mg={"Action":["Midnight Circuit","Neon Run","Redline","Iron Meridian","Velocity","Hollow Peak"],"Comedy":["Little Thunder","Open Mic Night","The Plus One","Salt Road","Second Wind","Fresh Start"],"Sci-Fi":["The Quiet Orbit","Static Bloom","Glass Tide","Signal Garden","Low Earth","Afterimage"],"Drama":["Last Harbour","Paper Kingdoms","Golden Hour","Northbound","Ash & Ember","The Long Way Home"]};
 var sg={"Crime":["Harbour Lights","Brass & Bone","Cold Frontier","The Understudy","Kestrel Bay","Dead Reckoning"],"Comedy":["Open Season","The Long Table","Flatshare","Office Hours","Neighbours Again","Plan B"],"Sci-Fi":["Signal Lost","Dust Bowl","Orbit Nine","The Quiet Fleet","Meridian","Afterglow"],"Drama":["Tidewater","Winter Quarter","The Inheritance","Small Hours","Southbound","Lighthouse"]};
 var d={movies:[],shows:[],chans:[]},mi=0,si=0;
 Object.keys(mg).forEach(function(g){mg[g].forEach(function(t){d.movies.push(mkItem({type:"movie",title:t,genre:g,year:2019+(mi%7),len:88+(mi*7)%52,rating:["12","15","PG","15"][mi%4],desc:descs[mi%descs.length],seed:(mi%7===2)?35+mi:0}));mi++})});
 Object.keys(sg).forEach(function(g){sg[g].forEach(function(t){d.shows.push(mkItem({type:"show",title:t,genre:g,year:2018+(si%8),seasons:1+(si%3),rating:["12","15","15","PG"][si%4],desc:descs[(si+2)%descs.length],seed:(si%8===1)?20+si*3:0}));si++})});
 var defs=[[101,"Lumen News 24","News"],[102,"Sport One","Sports"],[103,"Sport Two HD","Sports"],[104,"Cinema Classics","Movies"],[105,"Kids Club","Kids"],[106,"Nature World","Docs"],[107,"Music Hits","Music"],[108,"LOL TV","Comedy"],[109,"World Docs","Docs"],[110,"Premier Football","Sports"],[111,"Movie Max","Movies"],[112,"Toon Zone","Kids"]];
 var pool=["Evening Bulletin","Match Day Live","The Late Review","Wild Planet","Chart Countdown","Classic Matinee","Cartoon Hour","Studio Sessions","Deep Dive","Road to Glory","Weather & Travel","Kitchen Stories","Morning Headlines","Highlights Show"];
 defs.forEach(function(c){
  var r=seeded(c[0]*7),t=0,guide=[],durs=[30,60,60,90,30,60];
  while(t<300){var du=durs[Math.floor(r()*durs.length)];guide.push({title:pool[Math.floor(r()*pool.length)],start:t,dur:du});t+=du}
  d.chans.push(mkItem({type:"chan",num:c[0],title:c[1],genre:c[2],guide:guide,pct:15+Math.floor(r()*70)}));
 });
 return d;
}
/* ---- M3U parsing (runs locally in the browser) ---- */
function parseM3U(text){
 var lines=String(text).split(/\r?\n/),out=[],meta=null;
 for(var i=0;i<lines.length&&out.length<20000;i++){
  var ln=lines[i].trim();if(!ln)continue;
  if(ln.indexOf("#EXTINF")===0){meta=ln;continue}
  if(ln[0]==="#")continue;
  if(meta){
   var k=meta.lastIndexOf('",'),name=(k>-1?meta.slice(k+2):meta.slice(meta.lastIndexOf(",")+1)).trim()||"Untitled";
   var g=/group-title="([^"]*)"/i.exec(meta),no=/tvg-chno="(\d+)"/i.exec(meta);
   var type=/\/movie\//i.test(ln)?"movie":/\/series\//i.test(ln)?"show":"chan";
   out.push({name:name,group:(g&&g[1].trim())||"Uncategorised",url:ln,type:type,chno:no?+no[1]:0});
   meta=null;
  }
 }
 return out;
}
function buildData(entries){
 resetDB();var d={movies:[],shows:[],chans:[]},n=0;
 entries.forEach(function(e){
  if(e.type==="movie")d.movies.push(mkItem({type:"movie",title:e.name,genre:e.group,year:"",len:0,rating:"",desc:"",seed:0}));
  else if(e.type==="show")d.shows.push(mkItem({type:"show",title:e.name,genre:e.group,year:"",seasons:1,rating:"",desc:"",seed:0}));
  else{n++;d.chans.push(mkItem({type:"chan",num:e.chno||n,title:e.name,genre:e.group,guide:null,pct:0}))}
 });
 return d;
}
function groupBy(a){var o={};a.forEach(function(i){(o[i.genre]=o[i.genre]||[]).push(i)});return o}
function refilter(){
 var kids=prof().kids;
 movies=SRC.movies.filter(function(i){return !kids||i.rating!=="15"});
 shows=SRC.shows.filter(function(i){return !kids||i.rating!=="15"});
 chans=SRC.chans.filter(function(c){return !kids||KIDCH[c.genre]});
 movieG=groupBy(movies);showG=groupBy(shows);
 var cg=[];chans.forEach(function(c){if(cg.indexOf(c.genre)<0)cg.push(c.genre)});
 chanCats=["All","Favourites"].concat(cg.slice(0,24));
 heroItem=movies.length?movies[Math.min(6,movies.length-1)]:(shows.length?shows[0]:null);
 chanCat="All";movieGenre="All";showGenre="All";
}
function useData(d){SRC=d;refilter()}
function prog(it){var v=prof().prog[it.key];return v!==undefined?v:(it.seed||0)}
function nowP(c){return c.guide?c.guide[0].title:"Live"}
function nextP(c){return c.guide&&c.guide[1]?"Next at "+clock(c.guide[1].start)+": "+c.guide[1].title:c.genre}

/* ================= cards ================= */
function metaStr(it){return [it.year,it.genre].filter(Boolean).join(" \u00b7 ")}
function posterCard(it){return '<button class="card poster" data-f data-id="'+it.id+'" style="--g:'+grad(it.title)+'"><span class="t">'+esc(it.title)+'</span><span class="m">'+esc(metaStr(it))+'</span></button>'}
function wideCard(it){return '<button class="card wide" data-f data-id="'+it.id+'" style="--g:'+grad(it.title)+'"><span class="t">'+esc(it.title)+'</span><span class="m">'+(it.type==="movie"?"Movie":"Series")+'</span><i class="bar"><b style="width:'+prog(it)+'%"></b></i></button>'}
function chanCard(c){return '<button class="card chan" data-f data-id="'+c.id+'"><span class="top"><span class="logo-b" style="--g:'+grad(c.title)+'">'+esc(c.title.split(" ").map(function(w){return w[0]||""}).join("").slice(0,3))+'</span><span><span class="nm">'+esc(c.title)+'</span><br><span class="num">Channel '+c.num+'</span></span></span><span class="now"><span class="live-dot"></span>'+esc(nowP(c))+'</span>'+(c.guide?'<i class="bar" style="background:var(--bg3)"><b style="width:'+c.pct+'%"></b></i>':'')+'<span class="nx">'+esc(nextP(c))+'</span></button>'}
function row(title,html){return html?'<section class="row"><h3>'+esc(title)+'</h3><div class="strip">'+html+'</div></section>':""}
function mapJoin(a,f){return a.map(f).join("")}

/* ================= pages ================= */
var tab="home",chanCat="All",liveView="channels",movieGenre="All",showGenre="All";
var confirmRm=null,addingProf=false,newProf={name:"",kids:false};

function renderHome(){
 var h=heroItem,p=prof();
 var cont=movies.concat(shows).filter(function(i){var v=prog(i);return v>0&&v<96}).slice(0,20);
 var ml=SRC.movies.concat(SRC.shows).filter(function(i){return p.list[i.key]&&(movies.indexOf(i)>-1||shows.indexOf(i)>-1)});
 var favc=chans.filter(function(c){return p.favs[c.key]});
 var hero="";
 if(h){
  var bits=[h.year,'<span class="pill">'+esc(h.rating)+'</span>',h.len?h.len+" min":"",h.genre].filter(function(x){return x&&x!=='<span class="pill"></span>'});
  hero='<section class="hero" style="--g:'+grad(h.title)+'"><div><div class="tags">'+bits.map(function(b){return "<span>"+b+"</span>"}).join("")+'</div><h1>'+esc(h.title)+'</h1>'+(h.desc?'<p>'+esc(h.desc)+'</p>':'')+'<div class="btns"><button class="btn pri" data-f data-act="hero-play">&#9654; Play</button><button class="btn" data-f data-act="hero-info">More info</button></div></div></section>';
 }else hero='<div class="ph" style="padding-top:18px"><h2>Home</h2></div>';
 var rows=row("Continue watching",mapJoin(cont,wideCard))+row("My list",mapJoin(ml,posterCard))+row("Favourite channels",mapJoin(favc,chanCard))
  +row("Trending movies",mapJoin(movies.slice(0,16),posterCard))+row("Popular series",mapJoin(shows.slice(0,16),posterCard))+row("Live now",mapJoin(chans.slice(0,8),chanCard));
 if(!rows)rows='<p class="empty">Nothing to show yet. This playlist has no channels, movies or series for this profile.</p>';
 return '<div class="page">'+hero+rows+'</div>';
}
function chipRow(list,cur,attr){return '<div class="chips">'+list.map(function(c){return '<button class="chip'+(c===cur?" on":"")+'" data-f '+attr+'="'+esc(c)+'">'+esc(c)+'</button>'}).join("")+'</div>'}
function renderLive(){
 var p=prof();
 var list=chans.filter(function(c){return chanCat==="All"||(chanCat==="Favourites"?p.favs[c.key]:c.genre===chanCat)});
 var body,more="";
 if(!list.length){body='<p class="empty">'+(chanCat==="Favourites"?"No favourites yet. Open a channel and tap the star to add it.":"No channels in this category.")+'</p>'}
 else if(liveView==="channels"){
  var lim=list.slice(0,120);
  body='<div class="grid">'+mapJoin(lim,chanCard)+'</div>';
  if(list.length>lim.length)more='<p class="more">Showing the first '+lim.length+' of '+list.length+' channels. Pick a category or use search to find the rest.</p>';
 }else{
  var gl=list.slice(0,60);
  var head='<div class="ghead"><span class="gtime" style="flex-basis:132px;padding:10px 12px">Today</span>';
  for(var m=0;m<300;m+=30)head+='<span>'+clock(m)+'</span>';
  head+='</div>';
  body='<div class="gscroll">'+head+gl.map(function(c){
   var progs=c.guide||[{title:"No programme info in this playlist",start:0,dur:300}];
   return '<div class="grow"><button class="gch" data-f data-id="'+c.id+'">'+c.num+' <small>'+esc(c.title)+'</small></button>'+progs.map(function(pg,i){
    return '<button class="gprog'+(i===0?" now":"")+'" data-f data-id="'+c.id+'" data-prog="'+(c.guide?i:0)+'" style="width:'+(pg.dur*4-4)+'px">'+esc(pg.title)+(c.guide?'<small>'+clock(pg.start)+'</small>':'')+'</button>'}).join("")+'</div>'}).join("")+'</div>';
  if(list.length>gl.length)more='<p class="more">Showing the first '+gl.length+' channels.</p>';
 }
 return '<div class="page"><div class="ph"><h2>Live TV</h2><div class="seg"><button data-f data-view="channels" class="'+(liveView==="channels"?"on":"")+'">Channels</button><button data-f data-view="guide" class="'+(liveView==="guide"?"on":"")+'">Guide</button></div></div>'+chipRow(chanCats,chanCat,"data-cat")+body+more+'</div>';
}
function renderCatalog(kind){
 var src=kind==="movies"?movies:shows,G=kind==="movies"?movieG:showG,cur=kind==="movies"?movieGenre:showGenre;
 var title=kind==="movies"?"Movies":"TV Shows";
 var gn=Object.keys(G);
 if(!src.length)return '<div class="page"><div class="ph"><h2>'+title+'</h2></div><p class="empty">No '+title.toLowerCase()+' found in this playlist.</p></div>';
 var names=["All"].concat(gn.slice(0,24)),html;
 if(cur==="All"){
  var hasYear=src.some(function(i){return i.year});
  var recent=hasYear?src.slice().sort(function(a,b){return b.year-a.year}).slice(0,12):src.slice(0,30);
  html=row(hasYear?"Recently added":"Featured",mapJoin(recent,posterCard))+gn.slice(0,24).map(function(g){return row(g,mapJoin(G[g].slice(0,40),posterCard))}).join("");
 }else{
  var items=(G[cur]||[]),lim=items.slice(0,120);
  html='<div class="grid">'+mapJoin(lim,posterCard)+'</div>'+(items.length>lim.length?'<p class="more">Showing the first '+lim.length+' of '+items.length+'. Use search to find the rest.</p>':'');
 }
 return '<div class="page"><div class="ph"><h2>'+title+'</h2></div>'+chipRow(names,cur,"data-genre")+html+'</div>';
}
var kindName={xtream:"Xtream Codes",m3u:"M3U link",file:"M3U file",demo:"Sample content"};
function renderAccount(){
 var a=acct(),p=prof(),h="";
 h+='<div class="page"><div class="who"><div class="big-av" style="--g:'+avGrads[p.color%avGrads.length]+'">'+esc((p.name[0]||"?").toUpperCase())+'</div><div><h2>'+esc(p.name)+'</h2><p>'+(p.kids?"Kids profile":"Profile")+(a?" \u00b7 "+esc(a.name):"")+'</p></div></div>';
 if(a){
  var host=a.kind==="file"?a.fileName:(a.kind==="demo"?"Built-in sample":(a.kind==="xtream"?hostOf(a.server):hostOf(a.url)));
  h+='<div class="pn"><h3>Provider</h3><div class="kv">'
   +'<div><span>Name</span><b>'+esc(a.name)+'</b></div>'
   +'<div><span>Type</span><b>'+kindName[a.kind]+'</b></div>'
   +'<div><span>'+(a.kind==="file"?"File":"Server")+'</span><b>'+esc(host)+'</b></div>'
   +(a.kind==="xtream"?'<div><span>Username</span><b>'+esc(a.user)+'</b></div><div><span>Status</span><b class="ok">'+esc(a.status)+'</b></div><div><span>Expires</span><b>'+fmtDate(a.exp)+'</b></div><div><span>Connections</span><b>'+a.maxConn+' allowed</b></div>':'')
   +'<div><span>Live channels</span><b>'+SRC.chans.length+'</b></div><div><span>Movies</span><b>'+SRC.movies.length+'</b></div><div><span>Series</span><b>'+SRC.shows.length+'</b></div><div><span>Added</span><b>'+fmtDate(a.added)+'</b></div></div>'
   +'<div class="btns2">'+(a.kind==="file"?'<button class="sbtn pri" data-f data-act="replace">Replace file</button>':'<button class="sbtn pri" data-f data-act="refresh">Refresh playlist</button>')+'</div>'
   +(a.kind==="xtream"||a.kind==="m3u"?'<p class="note2">Preview: status, expiry and counts are sample values. The native app reads them from your provider.</p>':'')
   +'</div>';
 }
 h+='<div class="pn"><h3>Providers</h3>';
 accounts.forEach(function(x){
  var sub=x.kind==="file"?x.fileName:(x.kind==="demo"?"Sample content":hostOf(x.kind==="xtream"?x.server:x.url));
  h+='<div class="prow"><span class="pi" style="--g:'+grad(x.name)+'">'+esc(x.name.slice(0,2).toUpperCase())+'</span><span class="pt"><b>'+esc(x.name)+'</b><small>'+kindName[x.kind]+' \u00b7 '+esc(sub)+'</small></span>'
   +(x.id===activeId?'<span class="tagm">In use</span>':'<button class="sbtn" data-f data-use="'+x.id+'">Use</button>')
   +'<button class="sbtn dng" data-f data-rm="'+x.id+'">'+(confirmRm===x.id?"Tap again to remove":"Remove")+'</button></div>';
 });
 h+='<div class="btns2" style="margin-top:14px"><button class="sbtn pri" data-f data-act="addprovider">Add provider</button></div></div>';
 h+='<div class="pn"><h3>Profiles</h3>';
 profiles.forEach(function(x){
  h+='<div class="prow"><span class="pi" style="--g:'+avGrads[x.color%avGrads.length]+';border-radius:50%">'+esc((x.name[0]||"?").toUpperCase())+'</span><span class="pt"><b>'+esc(x.name)+'</b><small>'+(x.kids?"Hides 15+ titles and most channels":"Full library")+'</small></span>'
   +(x.id===profId?'<span class="tagm">Watching</span>':'<button class="sbtn" data-f data-prof="'+x.id+'">Switch</button>')+'</div>';
 });
 if(addingProf){
  h+='<div class="newp"><label class="sr" for="pname">Profile name</label><input id="pname" data-f maxlength="20" placeholder="Profile name" value="'+esc(newProf.name)+'"><button class="chip'+(newProf.kids?" on":"")+'" data-f data-act="kidsflag">Kids profile</button><button class="sbtn pri" data-f data-act="saveprof">Save</button><button class="sbtn" data-f data-act="cancelprof">Cancel</button></div>';
 }else if(profiles.length<5){

   case "refresh":toast("Playlist refreshed");break;
   case "toglandscape":settings.landscape=!settings.landscape;save();render('[data-act="toglandscape"]');break;
   case "addprof":addingProf=true;newProf={name:"",kids:false};render();var pn=$("#pname");if(pn)pn.focus();break;
   case "kidsflag":newProf.kids=!newProf.kids;render('[data-act="kidsflag"]');break;
   case "cancelprof":addingProf=false;render('[data-act="addprof"]');break;
   case "saveprof":
    var nm=newProf.name.trim();
    if(!nm){toast("Enter a profile name");var pn2=$("#pname");if(pn2)pn2.focus();break}
    profiles.push({id:"p"+Date.now(),name:nm,kids:newProf.kids,color:profiles.length,favs:{},list:{},prog:{}});
    addingProf=false;save();render('[data-act="addprof"]');toast("Profile added");break;
   case "signout":
    activeId=null;save();SRC={movies:[],shows:[],chans:[]};refilter();showLogin(false);break;
  }
  return;
 }
 var it=DB[t.dataset.id];if(!it)return;
 if(it.type==="chan"){
  if(t.dataset.prog&&t.dataset.prog!=="0"&&it.guide){toast("Reminder set for "+clock(it.guide[+t.dataset.prog].start));return}
  playItem(it);
 }else{
  if(!$("#search").hidden)$("#search").hidden=true;
  detailBack=t;openDetail(it);
 }
});
document.addEventListener("input",function(e){
 var t=e.target;
 if(t.dataset&&t.dataset.lf){lf[t.dataset.lf]=t.value;setErr("")}
 else if(t.id==="pname"){newProf.name=t.value}
 else if(t.id==="q")drawSearch();
});
$("#player").addEventListener("mousemove",showUI);
$("#player").addEventListener("touchstart",showUI,{passive:true});

/* ================= remote-style keyboard navigation ================= */
function scope(){
 if(!$("#player").hidden)return P.panel?$("#cpanel"):$("#ui");
 if(!$("#login").hidden)return $("#login");
 if(!$("#search").hidden)return $("#search");
 if(!$("#detail").hidden)return $("#detail");
 return document.body;
}
function visible(el){var r=el.getBoundingClientRect();return r.width>0&&r.height>0&&!el.hidden}
function move(dir){
 var sc=scope(),els=$$("[data-f]",sc).filter(visible);
 if(sc===document.body)els=els.filter(function(e){return !e.closest(".ov")});
 var curEl=document.activeElement;
 if(els.indexOf(curEl)<0){if(els[0])els[0].focus({preventScroll:true});return}
 var r=curEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,best=null,bs=1e9;
 els.forEach(function(el){
  if(el===curEl)return;
  var b=el.getBoundingClientRect(),dx=b.left+b.width/2-cx,dy=b.top+b.height/2-cy,ok,p,s;
  if(dir==="right"){ok=dx>6;p=dx;s=Math.abs(dy)}
  else if(dir==="left"){ok=dx<-6;p=-dx;s=Math.abs(dy)}
  else if(dir==="down"){ok=dy>6;p=dy;s=Math.abs(dx)}
  else{ok=dy<-6;p=-dy;s=Math.abs(dx)}
  if(!ok)return;
  var score=p+s*(dir==="left"||dir==="right"?4:1.2);
  if(score<bs){bs=score;best=el}
 });
 if(best){best.focus({preventScroll:true});best.scrollIntoView({block:(dir==="up"||dir==="down")?"center":"nearest",inline:"center",behavior:"smooth"})}
}
document.addEventListener("keydown",function(e){
 var k=e.key,ae=document.activeElement,typing=ae&&ae.tagName==="INPUT"&&ae.type!=="file";
 if(!$("#player").hidden){
  showUI();
  if(/^[0-9]$/.test(k)&&P.live){digit(k);e.preventDefault();return}
  if(k==="Escape"||k==="Backspace"||k==="GoBack"){e.preventDefault();if(P.panel)setPanel(false);else closePlayer();return}
  if(!P.panel){
   if(P.live){
    if(k==="ArrowUp"){e.preventDefault();tune(P.idx-1);return}
    if(k==="ArrowDown"){e.preventDefault();tune(P.idx+1);return}
    if(k==="ArrowLeft"){e.preventDefault();setPanel(true);return}
   }else{
    if(k==="ArrowLeft"){e.preventDefault();seekBy(-10);return}
    if(k==="ArrowRight"){e.preventDefault();seekBy(10);return}
    if(k===" "){e.preventDefault();togglePlay();return}
   }
  }
 }else{
  if(!$("#login").hidden&&k==="Enter"&&typing&&ae.dataset.lf){e.preventDefault();connect();return}
  if(k==="Escape"||(k==="Backspace"&&!typing)){
   if(!$("#login").hidden){if(loginAdd){e.preventDefault();hideLogin();if(lastFocus&&document.body.contains(lastFocus))lastFocus.focus({preventScroll:true})}return}
   e.preventDefault();
   if(!$("#search").hidden)closeSearch();else if(!$("#detail").hidden)closeDetail();
   else if(tab!=="home")setTab("home");
   return;
  }
 }
 var map={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};
 if(map[k]){
  if(typing&&(k==="ArrowLeft"||k==="ArrowRight"))return;
  e.preventDefault();move(map[k]);
 }
});

/* ================= start ================= */
load();applyTheme();
if(activeId&&acct()){activate(activeId)}
else{activeId=null;useData({movies:[],shows:[],chans:[]});render();showLogin(false)}
})();
</script>
