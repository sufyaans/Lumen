name: lumen
description: "Lumen: a player-only IPTV app for Android phones, Android TV and iOS/iPadOS."
publish_to: 'none'

# The app name, Android applicationId and iOS bundle ID are documented in
# README.md ("Renaming the app"). AppConfig.appName lives in lib/app/app_config.dart.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  device_info_plus: ^13.3.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.3
  material_ui: ^1.10.0
  shared_preferences: ^2.5.6
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  xml: ^7.1.0
  connectivity_plus: ^7.3.2
  path_provider: ^2.1.6
  cached_network_image: ^4.0.6
  file_picker: ^13.3.2
  flutter_cache_manager: ^3.5.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  wakelock_plus: ^1.8.2
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  shelf: ^1.4.3
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true

  # Fonts are bundled. Nothing is fetched at runtime.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
